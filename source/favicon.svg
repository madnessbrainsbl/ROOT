<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <mask id="glitchMask">
      <rect width="256" height="256" fill="white"/>
      <rect x="45" y="98" width="31" height="7" fill="black"/>
      <rect x="37" y="112" width="42" height="7" fill="black"/>
      <rect x="48" y="130" width="36" height="8" fill="black"/>
      <rect x="171" y="103" width="34" height="7" fill="black"/>
      <rect x="176" y="118" width="44" height="7" fill="black"/>
      <rect x="169" y="138" width="38" height="8" fill="black"/>
    </mask>
  </defs>

  <rect width="256" height="256" rx="42" fill="#050505"/>

  <rect x="20" y="20" width="216" height="216" rx="38"
        fill="none" stroke="#ff2020" stroke-width="14"
        filter="url(#softGlow)"/>

  <path d="M151 20h28l-6 7h-28z" fill="#ff2020"/>
  <path d="M229 67v28l-7-6V73z" fill="#ff2020"/>
  <path d="M27 156v27l-7 6v-39z" fill="#ff2020"/>

  <g filter="url(#glow)" mask="url(#glitchMask)">
    <ellipse cx="128" cy="128" rx="67" ry="76"
             fill="none" stroke="#ff2020" stroke-width="24"/>
    <path d="M73 195L181 59"
          stroke="#ff2020" stroke-width="24"
          stroke-linecap="square"/>
  </g>

  <g fill="#ff2020">
    <rect x="35" y="104" width="22" height="5"/>
    <rect x="29" y="119" width="34" height="5"/>
    <rect x="42" y="137" width="29" height="5"/>
    <rect x="195" y="109" width="25" height="5"/>
    <rect x="185" y="124" width="40" height="5"/>
    <rect x="195" y="143" width="28" height="5"/>
  </g>

  <g fill="#ff2020">
    <rect x="185" y="34" width="6" height="6"/>
    <rect x="198" y="34" width="6" height="6"/>
    <rect x="205" y="47" width="6" height="6"/>
    <rect x="42" y="202" width="6" height="6"/>
    <rect x="55" y="209" width="6" height="6"/>
    <rect x="68" y="202" width="6" height="6"/>
  </g>
</svg>
