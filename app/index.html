<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<base href="../">
<meta name="robots" content="noindex,follow">
<meta name="description" content="RØOT application-security practice workspace: OWASP labs, CTF challenges, public KEV catalog, tools, and reporting workflows.">
<title>RØOT App — OWASP · CTF · CVE</title>
<link rel="icon" href="source/favicon.ico" sizes="any">
<link rel="icon" href="source/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css?v=20260730-7">
</head>
<body>
<header id="hdr">
  <button class="menu-toggle" id="menu-toggle" type="button" aria-label="Menu" aria-expanded="false">☰</button>
  <a class="logo-img" href="app/#/lab/A01" title="RØOT">
    <img src="source/root.png" alt="RØOT" class="logo-word">
  </a>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="actions">
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-opt" id="lang-ru" data-lang="ru">RU</button>
      <button type="button" class="lang-opt" id="lang-en" data-lang="en">EN</button>
    </div>
  </div>
</header>

<nav id="sidebar">
  <!-- Unified OWASP navigation (built in refreshNav) -->
  <div id="navlist"></div>

  <div class="nsep"></div>
  <div class="nsec" data-i18n="toolkit">Resources</div>
  <div class="ni" data-nav="tools" data-route="tools" role="button" tabindex="0">
    <span class="nn" data-i18n="toolsNav">Tools</span><span class="nd"></span>
  </div>
  <div class="ni" data-nav="commands" data-route="commands" role="button" tabindex="0">
    <span class="nn" data-i18n="cmdsNav">Commands</span><span class="nd"></span>
  </div>
  <div class="ni" data-nav="reports" data-route="reports" role="button" tabindex="0">
    <span class="nn" data-i18n="reports">Report templates</span><span class="nd"></span>
  </div>

  <div class="nsep"></div>
  <div class="nsec">Zero-Day / KEV</div>
  <div class="ni" data-nav="zerodays" data-route="zerodays" role="button" tabindex="0">
    <span class="nn" data-i18n="zeroDays">Zero-Days</span><span class="nd"></span>
  </div>
</nav>

<main id="main">
  <div class="root-spin-wrap"><div class="root-spinner"></div></div>
</main>

<!-- SQL terminal (RØOT knowledge DB + Attack DB) -->
<div id="term" aria-label="SQL terminal">
  <div class="tbar">
    <span class="ttl" id="term-title">SQL terminal</span>
    <button type="button" class="ttab active" id="tab-main" data-sql-db="main">📚 RØOT DB</button>
    <button type="button" class="ttab" id="tab-atk" data-sql-db="attack">🔴 Attack DB</button>
    <button type="button" class="btn term-close" id="term-close" title="Close">✕</button>
  </div>
  <div id="tbody">
    <div id="tincol">
      <textarea id="tsql" spellcheck="false" placeholder="SELECT …  (Ctrl+Enter)"></textarea>
      <div id="tact">
        <span id="tmlbl">RØOT DB</span>
        <button type="button" class="btn" data-sql-action="history-next">↑</button>
        <button type="button" class="btn" data-sql-action="history-previous">↓</button>
        <button type="button" class="btn" data-sql-action="clear">Clear</button>
        <button type="button" class="btn btnp" data-sql-action="run">Run ▶</button>
      </div>
    </div>
    <div id="tout"><span style="color:var(--mut)">// query results</span></div>
    <div id="schema">
      <div class="stitle">Tables</div>
      <div id="slist"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script defer src="js/vendor/sql-wasm.js?v=20260730-1"></script>

</body>
</html>
